# Fly.io deployment configuration for VIGIL Trust API
app = "vigil-trust-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3100"

[http_service]
  internal_port = 3100
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/v1/health"
  protocol = "http"
  timeout = "5s"

[[statics]]
  guest_path = "/app/public"
  url_prefix = "/static"
