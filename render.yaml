services:
  - type: web
    name: vigil-trust-api
    runtime: docker
    plan: free
    buildCommand: docker build -t vigil-trust-api .
    dockerfile: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3100"
    healthCheckPath: /v1/health
    healthCheckInterval: 30
    healthCheckTimeout: 5
    healthCheckStartPeriod: 10
    maxShutdownDelaySeconds: 30

  - type: worker
    name: vigil-evaluator
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npx tsx src/lib/evaluator.ts
    envVars:
      - key: WHITELISTED_WALLET_PRIVATE_KEY
        sync: false
      - key: SESSION_ENTITY_KEY_ID
        sync: false
      - key: AGENT_WALLET_ADDRESS
        value: "0x564d9a8E9f97787D8b83a0e1986538B0EEAc3550"
      - key: NODE_ENV
        value: production

  - type: worker
    name: vigil-discord-bot
    runtime: node
    plan: free
    rootDir: discord-bot
    buildCommand: npm install
    startCommand: node bot.js
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        value: "1490088109419921508"
      - key: NODE_ENV
        value: production
